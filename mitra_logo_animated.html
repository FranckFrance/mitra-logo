<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; }
body { background: white; }
</style>
</head>
<body>
<svg id="logo" width="400" height="148" viewBox="0 0 400 148" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4bda9a"/>
      <stop offset="20%"  stop-color="#4bda9a"/>
      <stop offset="38%"  stop-color="#38a68b"/>
      <stop offset="55%"  stop-color="#40728b"/>
      <stop offset="73%"  stop-color="#2f3c79"/>
      <stop offset="100%" stop-color="#484c8d"/>
    </linearGradient>
    <clipPath id="cp"><circle cx="65" cy="72" r="60"/></clipPath>
  </defs>
  <path id="bigCircle"
    d="M 43.71,15.91 A 60,60 0 1,1 19.58,32.79"
    fill="none" stroke="url(#g1)" stroke-width="1.7" stroke-linecap="round"
    stroke-dasharray="347.3" stroke-dashoffset="347.3" style="opacity:0;"/>
  <circle id="smallCircle" cx="30" cy="22" r="15"
    fill="none" stroke="#4bda9a" stroke-width="1.7"
    stroke-dasharray="94" stroke-dashoffset="94" style="opacity:0;"/>
  <g clip-path="url(#cp)">
    <polyline id="chev1" points="9,132 65,44 121,132"
      fill="none" stroke="url(#g1)" stroke-width="1.7"
      stroke-linejoin="round" stroke-linecap="round"
      stroke-dasharray="265" stroke-dashoffset="265" style="opacity:0;"/>
    <polyline id="chev2" points="25,132 65,66 105,132"
      fill="none" stroke="url(#g1)" stroke-width="1.7"
      stroke-linejoin="round" stroke-linecap="round"
      stroke-dasharray="190" stroke-dashoffset="190" style="opacity:0;"/>
  </g>
  <text font-family="Montserrat, Arial, sans-serif" font-weight="400" font-size="36" fill="#1e2f6e" letter-spacing="2">
    <tspan id="m1" x="152" y="86" style="opacity:0">M</tspan>
    <tspan id="m2" style="opacity:0">I</tspan>
    <tspan id="m3" style="opacity:0">T</tspan>
    <tspan id="m4" style="opacity:0">R</tspan>
    <tspan id="m5" style="opacity:0">A</tspan>
  </text>
  <text font-family="Montserrat, Arial, sans-serif" font-weight="400" font-size="13" fill="#1e2f6e" letter-spacing="3">
    <tspan id="i1" x="152" y="103" style="opacity:0">I</tspan>
    <tspan id="i2" style="opacity:0">N</tspan>
    <tspan id="i3" style="opacity:0">T</tspan>
  </text>
</svg>
<script>
function play() {
  var bc = document.getElementById('bigCircle');
  bc.style.opacity = '1';
  bc.getBoundingClientRect();
  bc.style.transition = 'stroke-dashoffset 2.2s ease-in-out';
  bc.style.strokeDashoffset = '0';
  setTimeout(function() {
    var sc = document.getElementById('smallCircle');
    sc.style.opacity = '1'; sc.getBoundingClientRect();
    sc.style.transition = 'stroke-dashoffset 0.6s ease-in-out';
    sc.style.strokeDashoffset = '0';
  }, 2300);
  setTimeout(function() {
    var c1 = document.getElementById('chev1');
    c1.style.opacity = '1'; c1.getBoundingClientRect();
    c1.style.transition = 'stroke-dashoffset 1.0s ease-in-out';
    c1.style.strokeDashoffset = '0';
  }, 3000);
  setTimeout(function() {
    var c2 = document.getElementById('chev2');
    c2.style.opacity = '1'; c2.getBoundingClientRect();
    c2.style.transition = 'stroke-dashoffset 0.8s ease-in-out';
    c2.style.strokeDashoffset = '0';
  }, 3900);
  ['m1','m2','m3','m4','m5','i1','i2','i3'].forEach(function(id, i) {
    setTimeout(function() {
      var el = document.getElementById(id);
      el.style.transition = 'opacity 0.25s ease-out, transform 0.25s ease-out';
      el.style.opacity = '1';
    }, 4700 + i * 150);
  });
}
play();
</script>
</body>
</html>
