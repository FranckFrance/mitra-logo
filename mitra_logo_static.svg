<svg width="400" height="148" viewBox="0 0 400 148" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4bda9a"/>
      <stop offset="20%"  stop-color="#4bda9a"/>
      <stop offset="38%"  stop-color="#38a68b"/>
      <stop offset="55%"  stop-color="#40728b"/>
      <stop offset="73%"  stop-color="#2f3c79"/>
      <stop offset="100%" stop-color="#484c8d"/>
    </linearGradient>
    <clipPath id="cp"><circle cx="65" cy="72" r="60"/></clipPath>
  </defs>

  <!-- Grand cercle -->
  <path d="M 43.71,15.91 A 60,60 0 1,1 19.58,32.79"
    fill="none" stroke="url(#g1)" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Petit cercle -->
  <circle cx="30" cy="22" r="15" fill="none" stroke="#4bda9a" stroke-width="1.7"/>

  <!-- Chevrons -->
  <g clip-path="url(#cp)">
    <polyline points="9,132 65,44 121,132"
      fill="none" stroke="url(#g1)" stroke-width="1.7"
      stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="25,132 65,66 105,132"
      fill="none" stroke="url(#g1)" stroke-width="1.7"
      stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- MITRA -->
  <text font-family="Montserrat, Arial, sans-serif" font-weight="400" font-size="36"
    fill="#1e2f6e" letter-spacing="2" x="152" y="86">MITRA</text>

  <!-- INT -->
  <text font-family="Montserrat, Arial, sans-serif" font-weight="400" font-size="13"
    fill="#1e2f6e" letter-spacing="3" x="152" y="103">INT</text>
</svg>
